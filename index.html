<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mohammed Fawzey - Fullstack Java Developer</title>
    <meta name="description" content="Portfolio of Mohammed Fawzey — Fullstack Java Developer building modern, maintainable web applications with Vue.js and Spring Boot." />
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('portfolio-theme'); } catch (e) {}
        var dark;
        if (stored === 'dark') dark = true;
        else if (stored === 'light') dark = false;
        else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
